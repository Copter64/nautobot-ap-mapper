---
name: "CI"
concurrency:  # Cancel any existing runs of this workflow for this same PR
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
on: # yamllint disable-line rule:truthy rule:comments
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v*"
  pull_request: ~

env:
  APP_NAME: "ap-mapper"

jobs:
  generate-lockfile:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v7"
        with:
          poetry-version: "2.1.3"
          poetry-install-options: "--only-root"
      - name: "Regenerate poetry.lock"
        run: "poetry lock --regenerate"
      - name: "Upload poetry.lock"
        uses: "actions/upload-artifact@v4"
        with:
          name: "poetry-lock"
          path: "poetry.lock"

  lint:
    needs: "generate-lockfile"
    runs-on: "ubuntu-latest"
    env:
      INVOKE_AP_MAPPER_LOCAL: "True"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Download poetry.lock artifact"
        uses: "actions/download-artifact@v4"
        with:
          name: "poetry-lock"
      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v7"
        with:
          poetry-version: "2.1.3"
      - name: "Linting: ruff"
        run: "poetry run invoke ruff"
      - name: "Linting: djlint"
        run: "poetry run invoke djlint"
      - name: "Linting: yamllint"
        run: "poetry run invoke yamllint"
      - name: "Linting: markdownlint"
        run: "poetry run invoke markdownlint"

  check-in-docker:
    needs: "lint"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]
        nautobot-version: ["3.1.0"]
    env:
      INVOKE_AP_MAPPER_PYTHON_VER: "${{ matrix.python-version }}"
      INVOKE_AP_MAPPER_NAUTOBOT_VER: "${{ matrix.nautobot-version }}"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Download poetry.lock artifact"
        uses: "actions/download-artifact@v4"
        with:
          name: "poetry-lock"
      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v7"
        with:
          poetry-version: "2.1.3"
      - name: "Constrain Nautobot version and regenerate lock file"
        env:
          INVOKE_AP_MAPPER_LOCAL: "true"
        run: "poetry run invoke lock --constrain-nautobot-ver --constrain-python-ver=${{ matrix.python-version }}"
      - name: "Set up Docker Buildx"
        id: "buildx"
        uses: "docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2"  # v3.10.0
      - name: "Build Docker image"
        uses: "docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25"  # v5.4.0
        with:
          builder: "${{ steps.buildx.outputs.name }}"
          context: "./"
          push: false
          load: true
          tags: "${{ env.APP_NAME }}/nautobot:${{ matrix.nautobot-version }}-py${{ matrix.python-version }}"
          file: "./development/Dockerfile"
          cache-from: "type=gha,scope=${{ matrix.nautobot-version }}-py${{ matrix.python-version }}"
          cache-to: "type=gha,scope=${{ matrix.nautobot-version }}-py${{ matrix.python-version }}"
          build-args: |
            NAUTOBOT_VER=${{ matrix.nautobot-version }}
            PYTHON_VER=${{ matrix.python-version }}
            CI=true
      - name: "Linting: pylint"
        run: |
          docker run \
            --rm \
            --entrypoint "" \
            "${{ env.APP_NAME }}/nautobot:${{ matrix.nautobot-version }}-py${{ matrix.python-version }}" \
            bash -c "poetry run invoke pylint"
      - name: "Checking: validate-app-config"
        run: |
          docker run \
            --rm \
            --entrypoint "" \
            "${{ env.APP_NAME }}/nautobot:${{ matrix.nautobot-version }}-py${{ matrix.python-version }}" \
            bash -c "poetry run invoke validate-app-config"

  docs:
    needs: "lint"
    runs-on: "ubuntu-latest"
    env:
      INVOKE_AP_MAPPER_LOCAL: "True"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Download poetry.lock artifact"
        uses: "actions/download-artifact@v4"
        with:
          name: "poetry-lock"
      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v7"
        with:
          poetry-version: "2.1.3"
          poetry-install-options: "--only dev,docs"
      - name: "Docs: mkdocs build check"
        run: "poetry run invoke build-and-check-docs"
